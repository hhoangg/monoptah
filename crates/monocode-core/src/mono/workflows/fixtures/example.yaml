monoptahWorkflow: 1
name: ClickUp -> Dev -> Review
description: Pull my ClickUp tickets, implement each, review up to 3 rounds.
inputs:
  project:
    type: project
  clickupList:
    type: string
    description: ClickUp list to pull from
nodes:
  - id: trigger
    type: schedule
    schedule:
      kind: weekdays
      time: "09:00"
    ui:
      x: 0
      y: 0
  - id: fetch
    type: session
    project: "{{inputs.project}}"
    model: claude:sonnet-5
    checkout: root
    prompt: List open tickets assigned to me in {{inputs.clickupList}}.
    output:
      tickets:
        type: list
    ui:
      x: 240
      y: 0
  - id: each
    type: forEach
    in: "{{fetch.tickets}}"
    as: item
    maxParallel: 3
  - id: dev
    type: session
    parent: each
    project: "{{inputs.project}}"
    model: claude:sonnet-5
    checkout: newWorktree
    prompt: |
      Implement {{item.title}} ({{item.url}}) and open a PR.
      {{#if review}}Fix these review issues: {{review.issues}}{{/if}}
    output:
      pr_url:
        type: string
      summary:
        type: string
        inReport: false
  - id: review
    type: session
    parent: each
    project: "{{inputs.project}}"
    model: claude:opus-5
    checkout:
      worktreeOf: dev
    nestUnder: dev
    prompt: Review {{dev.pr_url}}. List blocking issues only.
    output:
      verdict:
        type: string
      issues:
        type: list
  - id: report
    type: report
edges:
  - from: trigger
    to: fetch
  - from: fetch
    to: each
  - from: dev
    to: review
  - from: each
    to: report
  - from: review
    to: dev
    loop:
      maxRounds: 3
      decide: mono
