# cargo-nextest settings. Two sets of sharded jobs in .github/workflows/native.yml use
# the `ci` profile: the GPUI tests (`desktop-test`, Linux) and the monocode-core tests
# (`core-windows-test`); the Linux `core` job runs it unsharded. `npm run native:test`
# runs both packages with the `default` profile. An override below must name its tests precisely,
# so it never changes tests of the other package.
#
# nextest runs every test in its own process, so process-global state (statics,
# env vars set by a test) never leaks between tests. Tests that share a fixed
# filesystem path or another machine-wide resource would collide when processes
# run in parallel: give them a unique path, or add a test group here:
#
#   [test-groups]
#   shared-resource = { max-threads = 1 }
#
#   [[profile.ci.overrides]]
#   filter = 'test(/some_module::/)'
#   test-group = 'shared-resource'

[profile.default]
fail-fast = false

[profile.ci]
# Report every failure of a run, and never retry: a flaky test must show up.
fail-fast = false
retries = 0
# Flag a test after 60s and terminate it after 3 periods (180s) so a hang cannot
# eat the whole job timeout.
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"

# Parses the 580 KB App.tsx twice under a wall-clock budget of about one second per
# 64 KiB (editor_analysis::analyze). Sharing the runner's CPUs with parallel tests can
# push it past that budget, so it runs alone.
[[profile.ci.overrides]]
filter = 'test(=editor_analysis::parity_tests::large_tsx_analysis_highlights_the_end_of_the_current_and_original_file)'
threads-required = "num-test-threads"

[profile.ci.junit]
# Written to <workspace>/target/nextest/ci/junit.xml (the remapped workspace root
# when run from an archive).
path = "junit.xml"
