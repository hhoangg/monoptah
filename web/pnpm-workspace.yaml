# Packages are added by their own workstreams; a glob that matches no
# directory is fine, so root scripts (`pnpm -r`) pick up each one as it appears.
packages:
  - protocol
  - worker
  - app
  - mock-desktop

# security.md section 8 item 8: no dependency runs an install script unless it is
# listed here. pnpm 12 reads `allowBuilds` (a package -> true map); the pnpm 10
# `onlyBuiltDependencies` list is ignored by pnpm 12 and a dependency with an
# unlisted build script fails the install with ERR_PNPM_IGNORED_BUILDS.
# Add a package only with the reason next to it.
allowBuilds:
  esbuild: true # downloads the platform binary; used by vite and wrangler
  workerd: true # Miniflare and wrangler runtime binary (the worker package)
