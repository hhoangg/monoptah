name: Monoptah Native Preview

on:
  push:
    branches: [main, mc/migrate-monocode-to-gpui]
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/monocode-core/**'
      - 'crates/monocode-gpui/**'
      - 'crates/mobile-link/**'
      - 'vendor/gpui-pre*/**'
      - 'scripts/*native*'
      - 'scripts/native-editor/**'
      - 'scripts/native-settings/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native.yml'
      - '.github/workflows/native-release.yml'
      - '.github/workflows/native-release-monoptah.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# macOS is not built or checked on CI at all: GitHub-hosted macOS runners are not
# reliably available. CI covers the core crate (clippy, tests) and the native node
# tests on Linux and Windows, GPUI fmt, clippy -D warnings and tests on Linux, a
# GPUI cargo check on Windows, and seeds the release caches. Only what needs a Mac
# stays local: clippy of the macOS-only code (npm run native:check:mac), macOS-only
# tests, and building and packaging (npm run native:release:mac, which also runs
# the full npm run native:check before every release).
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux core dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      # ci.yml, the other npm ci, is paused; the native release needs a good lock.
      # It also installs @tauri-apps/cli, without which the signing tests in
      # native:test:dev are skipped.
      - if: runner.os == 'Linux'
        run: npm ci
      - run: npm run native:test:dev
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --profile native-dev

  # GPUI itself, split into parallel jobs on purpose: clippy only produces
  # metadata while the test build needs full codegen, so they share little and
  # running them side by side is faster wall-clock than one job. No release
  # flags, so none of these share the release cache.
  #
  # Lint (Linux): fmt, then clippy -D warnings. Clippy already type-checks every
  # target, so a separate cargo check on Linux would only waste time.
  desktop-lint:
    name: GPUI lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - run: cargo fmt --manifest-path crates/monocode-gpui/Cargo.toml --all --check
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core -p monocode-gpui --all-targets --profile native-dev -- -D warnings

  # Windows keeps a compile check of every target (not clippy), so a change that
  # breaks the Windows build fails here and not halfway through a release.
  desktop:
    name: GPUI check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core -p monocode-gpui --all-targets --profile native-dev

  # The GPUI tests. macOS-only tests and the macOS build still run locally.
  desktop-test:
    name: GPUI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TEMP: Windows GPUI test probe - measures whether the Windows tests pass
        # and are cheap; drop windows-latest from this list if not.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-gpui --profile native-dev -- --test-threads=1

  # Release runs restore these, which is what makes a native release faster (a miss is
  # only slower). Keep the toolchain, per-OS setup and build command in step with
  # the package job in native-release-monoptah.yml, and the shared keys equal to
  # the ones it reads. The Linux cache also seeds the publish job, which builds
  # the update verifier example. The rpm job (AlmaLinux container) is seeded by
  # release-cache-rpm below, and macOS is built locally.
  release-cache:
    name: Seed the release build cache (${{ matrix.kind }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            key: native-monoptah-release-x86_64-unknown-linux-gnu
          - os: windows-latest
            kind: windows
            target: x86_64-pc-windows-msvc
            key: native-monoptah-release-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Link the Windows C runtime statically
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: ${{ matrix.key }}
          lookup-only: true
      - name: Install native Linux build dependencies
        if: matrix.kind == 'linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release
      # Only the publish job (Ubuntu) runs the verifier, so only Linux needs its
      # dependencies seeded.
      - if: matrix.kind == 'linux' && steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --example verify_monoptah_native_update --profile native-dev

  # Seeds the rpm cache. The rpm job builds in the same AlmaLinux container, and a
  # cache key includes the OS, the rustc version and a hash of the CARGO*, CC,
  # CFLAGS, CXX, CMAKE and RUST* environment variables (Swatinem/rust-cache
  # src/config.ts), so this job must have exactly the environment package-rpm has:
  # the same container, toolchain action, packages and no CARGO_* job env. Keep
  # the packages and the build command in step with package-rpm in
  # native-release-monoptah.yml. A miss is only slower.
  release-cache-rpm:
    name: Seed the release build cache (rpm)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: almalinux:10
    continue-on-error: true
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl tar zstd
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-rpm-el10
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release
