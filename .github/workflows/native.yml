name: Monoptah Native Preview

on:
  push:
    branches: [main, mc/migrate-monocode-to-gpui]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# The native-dev profile is incremental for local builds; CI builds start from a
# cache restore, where incremental data only costs time and cache space.
# dtolnay/rust-toolchain sets the same value when it is unset, so this does not
# change any rust-cache key (they hash CARGO* variables by name and value).
env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# macOS is not built or checked on CI at all: GitHub-hosted macOS runners are not
# reliably available. CI covers the core crate (clippy, tests) and the native node
# tests on Linux and Windows, GPUI fmt, clippy -D warnings and tests on Linux, a
# GPUI cargo check on Windows, and seeds the release caches. Only what needs a Mac
# stays local: clippy of the macOS-only code (npm run native:check:mac), macOS-only
# tests, and building and packaging (npm run native:release:mac, which also runs
# the full npm run native:check before every release).
#
# Job graph:
#   changes -> core, desktop-lint, desktop, desktop-test-build -> desktop-test (shards),
#              core-windows-build -> core-windows-test (shards)
#   release-cache, release-cache-rpm (push to main only, never blocking)
#   ci-passed waits for every job above and is the one check to require for merging.
#
# The workflow runs on every pull request (no `paths:` filter) so that `ci-passed`
# always reports. `changes` decides whether the native paths were touched; when they
# were not, the heavy jobs are skipped and `ci-passed` still succeeds.
jobs:
  # Path filter as a job instead of `on.pull_request.paths`: a required check must
  # report on every pull request, or one touching none of these paths could never
  # merge. Pushes and manual runs always build.
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.decide.outputs.native }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'crates/monocode-core/**'
              - 'crates/monocode-gpui/**'
              - 'crates/mobile-link/**'
              - 'vendor/gpui-pre*/**'
              - 'scripts/*native*'
              - 'scripts/native-editor/**'
              - 'scripts/native-settings/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/native.yml'
              - '.github/workflows/native-release.yml'
              - '.github/workflows/native-release-monoptah.yml'
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILTERED: ${{ steps.filter.outputs.native }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            native="$FILTERED"
          else
            native=true
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native=$native"

  # Core crate on Linux: native node tests, clippy and the tests in one job. The Windows
  # core tests are sharded below (core-windows-build and core-windows-test).
  core:
    name: Core (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      # ci.yml, the other npm ci, is paused; the native release needs a good lock.
      # It also installs @tauri-apps/cli, without which the signing tests in
      # native:test:dev are skipped.
      - run: npm ci
      - run: npm run native:test:dev
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --profile native-dev

  # Core crate on Windows, built once and run in shards, the same way as the GPUI tests
  # below: one `cargo test` run took about 12 minutes (3.6 compile, 8.5 running the lib
  # tests), which made it the critical path.
  #
  # Build: native node tests and clippy (as on Linux), then `cargo nextest archive`
  # compiles the core test binaries into one artifact. shared-key keeps restoring the
  # cache that main saved under the old matrix job id `core`; its key hashes
  # CARGO*/RUST*/CC*/CFLAGS*/CXX*/CMAKE* env vars, so do not add such variables to
  # this job.
  core-windows-build:
    name: Core test build (windows-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: core
      - run: npm run native:test:dev
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --all-targets --profile native-dev -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - name: Archive the core tests
        shell: bash
        run: cargo nextest archive --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core --cargo-profile native-dev --archive-file "$RUNNER_TEMP/core-tests.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: core-test-archive
          path: ${{ runner.temp }}/core-tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Each shard runs its share of the archived core tests, every test in its own process
  # (profile `ci` in crates/monocode-gpui/.config/nextest.toml). No rust-cache: nothing
  # is compiled here. The checkout is needed because tests read repo files and run git
  # at run time. Tune `total` (and the matrix list) from the measured shard times; keep
  # them equal.
  core-windows-test:
    name: Core tests (windows-latest, shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, core-windows-build]
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - uses: actions/download-artifact@v4
        with:
          name: core-test-archive
          path: ${{ runner.temp }}/core-archive
      - name: Run shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          # Written to a file, not piped through tee: on Windows a process that a test
          # leaves running inherits nextest's stdout, so tee would wait for it to exit
          # (one shard sat 10 minutes after nextest's summary). The log is printed after
          # the run. --status-level leak names the tests that leave a process behind.
          status=0
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/core-archive/core-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/crates/monocode-gpui" \
            --config-file "$GITHUB_WORKSPACE/crates/monocode-gpui/.config/nextest.toml" \
            --profile ci \
            --status-level leak \
            --partition "slice:$SHARD/$TOTAL" > "$RUNNER_TEMP/nextest.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/nextest.log" || true
          # nextest writes the JUnit file under the remapped workspace.
          junit="$GITHUB_WORKSPACE/crates/monocode-gpui/target/nextest/ci/junit.xml"
          if [ -f "$junit" ]; then cp "$junit" "$RUNNER_TEMP/junit-shard-$SHARD.xml" || true; fi
          # "Summary [ 12.3s] 1200 tests run: 1199 passed (2 slow), 1 failed, 1 timed out, 6 skipped"
          # Every command below is guarded so the summary can never replace nextest's exit status.
          line="$(grep -E 'tests? run:' "$RUNNER_TEMP/nextest.log" | tail -n 1 || true)"
          count() { printf '%s' "$line" | grep -oE "[0-9]+ $1" | head -n 1 | grep -oE '[0-9]+' || echo 0; }
          run="$(printf '%s' "$line" | grep -oE '[0-9]+ tests? run' | grep -oE '[0-9]+' || echo 0)"
          {
            echo "Core shard $SHARD/$TOTAL: run $run, passed $(count passed || true), failed $(count failed || true), timed out $(count 'timed out' || true), skipped (incl. other shards and ignored) $(count skipped || true) (exit $status)"
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-windows-junit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-shard-${{ matrix.shard }}.xml
          retention-days: 7
          if-no-files-found: error

  # GPUI itself, split into parallel jobs on purpose: clippy only produces
  # metadata while the test build needs full codegen, so they share little and
  # running them side by side is faster wall-clock than one job. No release
  # flags, so none of these share the release cache.
  #
  # Lint (Linux): fmt, then clippy -D warnings. Clippy already type-checks every
  # target, so a separate cargo check on Linux would only waste time.
  desktop-lint:
    name: GPUI lint (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - run: cargo fmt --manifest-path crates/monocode-gpui/Cargo.toml --all --check
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core -p monocode-gpui --all-targets --profile native-dev -- -D warnings

  # Windows keeps a compile check of every target (not clippy), so a change that
  # breaks the Windows build fails here and not halfway through a release.
  desktop:
    name: GPUI check (windows-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-core -p monocode-gpui --all-targets --profile native-dev

  # The GPUI tests, built once and run in shards. macOS-only tests and the macOS
  # build still run locally.
  #
  # Build: `cargo nextest archive` compiles the test binaries (the slow part) and packs
  # them into one artifact. shared-key keeps restoring the cache that main saved under
  # the old job id `desktop-test`; its key hashes CARGO*/RUST*/CC*/CMAKE* env vars, so do
  # not add such variables to this job.
  #
  # Linux only. Windows GPUI tests are not run: a probe took 23 minutes to build and its
  # tests were still running (with failures) when it hit the 60 minute limit. Windows
  # keeps the compile check above.
  desktop-test-build:
    name: GPUI test build (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: desktop-test
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - run: cargo nextest archive --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-gpui --cargo-profile native-dev --archive-file "$RUNNER_TEMP/gpui-tests.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-test-archive
          path: ${{ runner.temp }}/gpui-tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Each shard runs its share of the archived tests, every test in its own process
  # (profile `ci` in crates/monocode-gpui/.config/nextest.toml, so `env::set_var` in a
  # test cannot reach another test). No rust-cache: nothing is compiled here. The
  # checkout is needed because tests read repo files at run time. Tune `total` (and the
  # matrix list) from the measured shard times; keep them equal.
  desktop-test:
    name: GPUI tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, desktop-test-build]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4
      - name: Install native Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - uses: actions/download-artifact@v4
        with:
          name: gpui-test-archive
          path: ${{ runner.temp }}/gpui-archive
      - name: Run shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          # pipefail is on (shell: bash), so the status below is nextest's, not tee's.
          status=0
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/gpui-archive/gpui-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/crates/monocode-gpui" \
            --config-file "$GITHUB_WORKSPACE/crates/monocode-gpui/.config/nextest.toml" \
            --profile ci \
            --partition "slice:$SHARD/$TOTAL" 2>&1 | tee "$RUNNER_TEMP/nextest.log" || status=$?
          # nextest writes the JUnit file under the remapped workspace.
          junit="$GITHUB_WORKSPACE/crates/monocode-gpui/target/nextest/ci/junit.xml"
          if [ -f "$junit" ]; then cp "$junit" "$RUNNER_TEMP/junit-shard-$SHARD.xml" || true; fi
          # "Summary [ 12.3s] 1200 tests run: 1199 passed (2 slow), 1 failed, 1 timed out, 6 skipped"
          # Every command below is guarded so the summary can never replace nextest's exit status.
          line="$(grep -E 'tests? run:' "$RUNNER_TEMP/nextest.log" | tail -n 1 || true)"
          count() { printf '%s' "$line" | grep -oE "[0-9]+ $1" | head -n 1 | grep -oE '[0-9]+' || echo 0; }
          run="$(printf '%s' "$line" | grep -oE '[0-9]+ tests? run' | grep -oE '[0-9]+' || echo 0)"
          {
            echo "Shard $SHARD/$TOTAL: run $run, passed $(count passed || true), failed $(count failed || true), timed out $(count 'timed out' || true), skipped (incl. other shards and ignored) $(count skipped || true) (exit $status)"
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-junit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-shard-${{ matrix.shard }}.xml
          retention-days: 7
          if-no-files-found: error

  # Release runs restore these, which is what makes a native release faster (a miss is
  # only slower). Keep the toolchain, per-OS setup and build command in step with
  # the package job in native-release-monoptah.yml, and the shared keys equal to
  # the ones it reads. The Linux cache also seeds the publish job, which builds
  # the update verifier example. The rpm job (AlmaLinux container) is seeded by
  # release-cache-rpm below, and macOS is built locally.
  release-cache:
    name: Seed the release build cache (${{ matrix.kind }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            key: native-monoptah-release-x86_64-unknown-linux-gnu
          - os: windows-latest
            kind: windows
            target: x86_64-pc-windows-msvc
            key: native-monoptah-release-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Link the Windows C runtime statically
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: ${{ matrix.key }}
          lookup-only: true
      - name: Install native Linux build dependencies
        if: matrix.kind == 'linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release
      # Only the publish job (Ubuntu) runs the verifier, so only Linux needs its
      # dependencies seeded.
      - if: matrix.kind == 'linux' && steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --example verify_monoptah_native_update --profile native-dev

  # Seeds the rpm cache. The rpm job builds in the same AlmaLinux container, and a
  # cache key includes the OS, the rustc version and a hash of the CARGO*, CC,
  # CFLAGS, CXX, CMAKE and RUST* environment variables (Swatinem/rust-cache
  # src/config.ts), so this job must have exactly the environment package-rpm has:
  # the same container, toolchain action, packages and no CARGO_* job env. Keep
  # the packages and the build command in step with package-rpm in
  # native-release-monoptah.yml. A miss is only slower.
  release-cache-rpm:
    name: Seed the release build cache (rpm)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: almalinux:10
    continue-on-error: true
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl tar zstd
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-rpm-el10
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release

  # The one check to require for merging. It runs on every pull request and push
  # (the workflow has no path filter), also when jobs failed or were skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - core
      - desktop-lint
      - desktop
      - desktop-test-build
      - desktop-test
      - core-windows-build
      - core-windows-test
      - release-cache
      - release-cache-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of all jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          native="$(jq -r '.changes.outputs.native // ""' <<<"$NEEDS")"
          changes_result="$(jq -r '.changes.result' <<<"$NEEDS")"
          failed=0
          printf '%-24s %-10s %s\n' JOB RESULT VERDICT
          for job in changes core core-windows-build core-windows-test desktop-lint desktop desktop-test-build desktop-test release-cache release-cache-rpm; do
            result="$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")"
            reason=""
            case "$result" in
              success) ;;
              skipped)
                case "$job" in
                  release-cache|release-cache-rpm) ;; # main pushes only
                  changes) reason="the change detection must run" ;;
                  *)
                    if [ "$changes_result" != success ]; then
                      reason="skipped but change detection did not succeed"
                    elif [ "$native" = true ]; then
                      reason="skipped although native paths changed"
                    fi
                    ;;
                esac
                ;;
              *) reason="job result is $result" ;;
            esac
            if [ -n "$reason" ]; then
              failed=1
              printf '%-24s %-10s FAIL: %s\n' "$job" "$result" "$reason"
            else
              printf '%-24s %-10s ok\n' "$job" "$result"
            fi
          done
          echo "native changes: ${native:-unknown}"
          if [ "$failed" -ne 0 ]; then
            echo "CI failed: see the FAIL rows above."
            exit 1
          fi
          echo "CI passed."
