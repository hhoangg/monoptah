# Fork-local release workflow (Monoptah). Pushing a v* tag builds one ad-hoc
# signed macOS app and attaches it to a GitHub Release for a Homebrew cask.
# It reads no repository secrets: only the automatic GITHUB_TOKEN is used.
# There is no Apple signing, notarization, updater, or R2 upload here.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi

      # The same script fails the job when the section is missing and writes
      # that section out as the release notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          node - "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const [version, out] = process.argv.slice(2);
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(`^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`);
          const start = lines.findIndex((line) => heading.test(line));
          if (start === -1) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          let end = lines.findIndex((line, i) => i > start && line.startsWith("## ["));
          if (end === -1) end = lines.length;
          const body = lines.slice(start + 1, end).join("\n").trim();
          if (!body) {
            console.error(`CHANGELOG.md section for ${version} is empty`);
            process.exit(1);
          }
          writeFileSync(out, body + "\n");
          NODE

      # createUpdaterArtifacts is switched off for this build instead of
      # tolerating the exit code. tauri.conf.json enables it with an empty
      # updater key, so a full build would end in a missing
      # TAURI_SIGNING_PRIVATE_KEY error even though the .app is written. A
      # job-level "ignore failure" would also publish after a real compile
      # error. With the override the build is clean and any non-zero exit is a
      # real failure.
      - name: Build macOS app
        run: |
          set -euo pipefail
          npx tauri build --target "$TARGET" --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify app architecture and signature
        run: |
          set -euo pipefail
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected $APP to contain only arm64, got: $ARCHS" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ditto keeps symlinks and extended attributes that plain zip can break
      # inside an .app bundle. The sha256 file is what the cask pins.
      - name: Package app as zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          ASSETS="$RUNNER_TEMP/release-assets"
          ZIP="Monoptah_${VERSION}_aarch64.zip"
          mkdir -p "$ASSETS"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSETS/$ZIP"
          (cd "$ASSETS" && shasum -a 256 "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")

      # gh release create fails if the tag already has a release, so a
      # published asset (and the sha256 a cask pinned) is never replaced.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS="$RUNNER_TEMP/release-assets"
          gh release create "$GITHUB_REF_NAME" \
            "$ASSETS/Monoptah_${VERSION}_aarch64.zip" \
            "$ASSETS/Monoptah_${VERSION}_aarch64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Monoptah $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
