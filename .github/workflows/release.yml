# Fork-local release workflow (Monoptah). Pushing a v* tag builds an ad-hoc
# signed macOS app plus Linux, Windows, and standalone host packages, and
# attaches them all to one GitHub Release (the macOS zip is what a Homebrew
# cask pins). The only secrets read are the two updater signing secrets,
# TAURI_SIGNING_PRIVATE_KEY and its password, plus the automatic GITHUB_TOKEN.
# Those sign the updater bundles that latest.json points at. There is no Apple
# signing, notarization, or R2 upload here.
#
# tauri.linux.conf.json and tauri.windows.conf.json set createUpdaterArtifacts
# to false so a plain local build needs no key. The Linux and Windows jobs
# therefore pass src-tauri/tauri.updater.conf.json, which turns it back on.
# Staging never asserts a signature file name. It globs for *.sig, pairs each
# with the file it signs, and fails when there is none, so a build that did
# not sign cannot slip into a release.
name: Release

on:
  push:
    tags:
      - "v*"

# Only the release job publishes, so only it gets write access.
permissions:
  contents: read

jobs:
  release:
    needs: [linux, linux-rpm, windows, host]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi

      # The same script fails the job when the section is missing and writes
      # that section out as the release notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          node - "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const [version, out] = process.argv.slice(2);
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(`^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`);
          const start = lines.findIndex((line) => heading.test(line));
          if (start === -1) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          let end = lines.findIndex((line, i) => i > start && line.startsWith("## ["));
          if (end === -1) end = lines.length;
          const body = lines.slice(start + 1, end).join("\n").trim();
          if (!body) {
            console.error(`CHANGELOG.md section for ${version} is empty`);
            process.exit(1);
          }
          writeFileSync(out, body + "\n");
          NODE

      # tauri.conf.json has createUpdaterArtifacts on and there is no macOS
      # platform config to turn it off, so this build also writes an updater
      # archive next to the .app and signs it with the key below. A missing
      # key makes the build fail, which is what we want: no unsigned update.
      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --target "$TARGET" --bundles app

      - name: Verify app architecture and signature
        run: |
          set -euo pipefail
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected $APP to contain only arm64, got: $ARCHS" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ditto keeps symlinks and extended attributes that plain zip can break
      # inside an .app bundle. The sha256 file is what the cask pins. The
      # updater archive is found by its signature and keeps the name tauri
      # gave it, because the signature records that file name.
      - name: Package app as zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          ASSETS="$RUNNER_TEMP/release-assets"
          ZIP="Monoptah_${VERSION}_aarch64.zip"
          mkdir -p "$ASSETS"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSETS/$ZIP"
          (cd "$ASSETS" && shasum -a 256 "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")
          sigs=("$(dirname "$APP")"/*.sig)
          if (( ${#sigs[@]} == 0 )); then
            echo "tauri wrote no updater signature next to $APP" >&2
            exit 1
          fi
          for sig in "${sigs[@]}"; do
            signed="${sig%.sig}"
            test -s "$signed" || { echo "Signature has no signed file: $sig" >&2; exit 1; }
            cp "$signed" "$sig" "$ASSETS/"
          done

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-downloads/linux

      - name: Download Linux rpm package
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm-package
          path: release-downloads/rpm

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-downloads/windows

      - name: Download host packages
        uses: actions/download-artifact@v4
        with:
          name: host-packages
          path: release-downloads/host

      # gh release create fails if the tag already has a release, so a
      # published asset (and the sha256 a cask pinned) is never replaced.
      # latest.json is generated here, after all builds, and the script
      # verifies every signature against the public key in tauri.conf.json
      # before writing it. Every asset name is checked for duplicates first
      # because release assets are flat and a clash would fail the upload
      # after the release already exists.
      #
      # Each platform job staged only the installers plus the signed pairs it
      # found, so everything in the download directories is published as is.
      # The updater bundle per platform is whichever signed file is left once
      # .deb and .rpm are set aside. Exactly one must remain, otherwise the
      # release stops here instead of shipping an update nobody can verify.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS="$RUNNER_TEMP/release-assets"
          DOWNLOADS="release-downloads"
          shopt -s nullglob
          # usage: expect_one <label> <matches...>
          expect_one() {
            local label="$1"
            shift
            if (( $# != 1 )); then
              echo "Expected exactly one $label, found $#" >&2
              return 1
            fi
          }
          # Prints the one file in <dir> that has a .sig, ignoring files that
          # end in one of the given extensions. Every .sig must have its
          # signed file next to it, and at least one must exist.
          # usage: signed_bundle <dir> [skipped-extension...]
          signed_bundle() {
            local dir="$1" sig signed skip ext
            local found=()
            shift
            for sig in "$dir"/*.sig; do
              signed="${sig%.sig}"
              if [[ ! -s "$signed" ]]; then
                echo "Signature has no signed file: $sig" >&2
                return 1
              fi
              skip=0
              for ext in "$@"; do
                if [[ "$signed" == *".$ext" ]]; then skip=1; fi
              done
              if (( skip == 0 )); then found+=("$signed"); fi
            done
            if (( ${#found[@]} != 1 )); then
              echo "Expected exactly one signed updater bundle in $dir, found ${#found[@]}" >&2
              return 1
            fi
            printf '%s\n' "${found[0]}"
          }
          expect_one "macOS zip" "$ASSETS"/*.zip
          expect_one ".deb" "$DOWNLOADS"/linux/*.deb
          expect_one "AppImage" "$DOWNLOADS"/linux/*.AppImage
          expect_one ".rpm" "$DOWNLOADS"/rpm/*.rpm
          expect_one "NSIS installer" "$DOWNLOADS"/windows/*.exe
          MAC_BUNDLE=$(signed_bundle "$ASSETS")
          LINUX_BUNDLE=$(signed_bundle "$DOWNLOADS/linux" deb rpm)
          WINDOWS_BUNDLE=$(signed_bundle "$DOWNLOADS/windows")
          HOST_ARCHIVES=("$DOWNLOADS"/host/*.tar.gz "$DOWNLOADS"/host/*.zip)
          if (( ${#HOST_ARCHIVES[@]} != 6 )); then
            echo "Expected six host archives" >&2
            exit 1
          fi
          HOST_FILES=()
          for archive in "${HOST_ARCHIVES[@]}"; do
            if [[ ! -f "$archive.sha256" ]]; then
              echo "Missing host checksum: $archive.sha256" >&2
              exit 1
            fi
            HOST_FILES+=("$archive" "$archive.sha256")
          done
          RELEASE_FILES=(
            "$ASSETS"/*
            "$DOWNLOADS"/linux/*
            "$DOWNLOADS"/rpm/*
            "$DOWNLOADS"/windows/*
            "${HOST_FILES[@]}"
          )
          # The plain {os}-{arch} keys are the fallback the updater uses when
          # no installer-specific key matches. They must exist for every
          # platform, because the updater looks its target up even when the
          # app is already current. There is no deb or rpm key: those
          # packages are downloads only and have no updater bundle.
          node scripts/make-update-manifest.mjs "$VERSION" "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-notes.md" "$ASSETS/latest.json" \
            "darwin-aarch64,darwin-aarch64-app=$MAC_BUNDLE" \
            "linux-x86_64,linux-x86_64-appimage=$LINUX_BUNDLE" \
            "windows-x86_64,windows-x86_64-nsis=$WINDOWS_BUNDLE"
          RELEASE_FILES+=("$ASSETS/latest.json")
          DUPLICATES=$(printf '%s\n' "${RELEASE_FILES[@]}" | xargs -n1 basename | sort | uniq -d)
          if [[ -n "$DUPLICATES" ]]; then
            echo "Duplicate release asset names:" >&2
            echo "$DUPLICATES" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${RELEASE_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Monoptah $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  host:
    name: Standalone host packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --all
        if: runner.os == 'Linux'
      - run: npm run host:package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      # tauri.linux.conf.json turns updater artifacts off, so the overlay
      # config turns them back on and tauri signs what it considers
      # updatable. Which files those are is decided at staging time.
      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux -- --config src-tauri/tauri.updater.conf.json

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          # Pair every signature tauri wrote with the file it signs instead
          # of assuming which installers get one. No signature at all means
          # the build did not sign, so stop.
          sigs=(target/release/bundle/*/*.sig)
          if (( ${#sigs[@]} == 0 )); then
            echo "tauri wrote no updater signature under target/release/bundle" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" release-artifacts/
          for sig in "${sigs[@]}"; do
            signed="${sig%.sig}"
            test -s "$signed" || { echo "Signature has no signed file: $sig" >&2; exit 1; }
            cp "$signed" "$sig" release-artifacts/
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  linux-rpm:
    name: Linux rpm package
    runs-on: ubuntu-latest
    # Build on EL 10 so the published rpm's glibc requirement matches the
    # oldest advertised target. Fedora 43 is newer and would install on EL 10
    # while failing to load.
    container: almalinux:10
    steps:
      # almalinux:10 ships no git, which actions/checkout otherwise has to work
      # around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      # The rpm is a download only, not an updater target, so this build
      # keeps updater artifacts off and needs no signing key.
      - name: Build rpm package
        run: npm run build:fedora

      - name: Install and stage the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, and the setup script has already
          # installed every -devel package, so assert the metadata directly.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # tauri.windows.conf.json turns updater artifacts off, so the overlay
      # config turns them back on and tauri signs what it considers
      # updatable. Which files those are is decided at staging time.
      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config src-tauri/tauri.updater.conf.json

      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer"
          }
          # Pair every signature tauri wrote with the file it signs instead
          # of assuming which installers get one. No signature at all means
          # the build did not sign, so stop.
          $sigs = @(Get-ChildItem -Path "target/release/bundle/*" -Filter "*.sig" -File)
          if ($sigs.Count -eq 0) {
            throw "tauri wrote no updater signature under target/release/bundle"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item -Path $installers[0].FullName -Destination "release-artifacts/"
          foreach ($sig in $sigs) {
            $signed = $sig.FullName.Substring(0, $sig.FullName.Length - ".sig".Length)
            if (-not (Test-Path -LiteralPath $signed -PathType Leaf)) {
              throw "Signature has no signed file: $($sig.FullName)"
            }
            Copy-Item -LiteralPath $signed, $sig.FullName -Destination "release-artifacts/"
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error
