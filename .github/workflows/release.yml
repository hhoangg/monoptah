# Fork-local release workflow (Monoptah). Pushing a v* tag builds an ad-hoc
# signed macOS app plus Linux, Windows, and standalone host packages, and
# attaches them all to one GitHub Release (the macOS zip is what a Homebrew
# cask pins). It reads no repository secrets: only the automatic GITHUB_TOKEN
# is used. There is no Apple signing, notarization, updater, or R2 upload here.
name: Release

on:
  push:
    tags:
      - "v*"

# Only the release job publishes, so only it gets write access.
permissions:
  contents: read

jobs:
  release:
    needs: [linux, linux-rpm, windows, host]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi

      # The same script fails the job when the section is missing and writes
      # that section out as the release notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          node - "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const [version, out] = process.argv.slice(2);
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(`^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`);
          const start = lines.findIndex((line) => heading.test(line));
          if (start === -1) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          let end = lines.findIndex((line, i) => i > start && line.startsWith("## ["));
          if (end === -1) end = lines.length;
          const body = lines.slice(start + 1, end).join("\n").trim();
          if (!body) {
            console.error(`CHANGELOG.md section for ${version} is empty`);
            process.exit(1);
          }
          writeFileSync(out, body + "\n");
          NODE

      # createUpdaterArtifacts is switched off for this build instead of
      # tolerating the exit code. tauri.conf.json enables it with an empty
      # updater key, so a full build would end in a missing
      # TAURI_SIGNING_PRIVATE_KEY error even though the .app is written. A
      # job-level "ignore failure" would also publish after a real compile
      # error. With the override the build is clean and any non-zero exit is a
      # real failure.
      - name: Build macOS app
        run: |
          set -euo pipefail
          npx tauri build --target "$TARGET" --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify app architecture and signature
        run: |
          set -euo pipefail
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected $APP to contain only arm64, got: $ARCHS" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ditto keeps symlinks and extended attributes that plain zip can break
      # inside an .app bundle. The sha256 file is what the cask pins.
      - name: Package app as zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="target/$TARGET/release/bundle/macos/Monoptah.app"
          ASSETS="$RUNNER_TEMP/release-assets"
          ZIP="Monoptah_${VERSION}_aarch64.zip"
          mkdir -p "$ASSETS"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSETS/$ZIP"
          (cd "$ASSETS" && shasum -a 256 "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-downloads/linux

      - name: Download Linux rpm package
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm-package
          path: release-downloads/rpm

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-downloads/windows

      - name: Download host packages
        uses: actions/download-artifact@v4
        with:
          name: host-packages
          path: release-downloads/host

      # gh release create fails if the tag already has a release, so a
      # published asset (and the sha256 a cask pinned) is never replaced.
      # Every asset name is checked for duplicates first because release
      # assets are flat and a clash would fail the upload after the release
      # already exists.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS="$RUNNER_TEMP/release-assets"
          DOWNLOADS="release-downloads"
          shopt -s nullglob
          RPMS=("$DOWNLOADS"/rpm/*.rpm)
          if (( ${#RPMS[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          HOST_ARCHIVES=("$DOWNLOADS"/host/*.tar.gz "$DOWNLOADS"/host/*.zip)
          if (( ${#HOST_ARCHIVES[@]} != 6 )); then
            echo "Expected six host archives" >&2
            exit 1
          fi
          HOST_FILES=()
          for archive in "${HOST_ARCHIVES[@]}"; do
            if [[ ! -f "$archive.sha256" ]]; then
              echo "Missing host checksum: $archive.sha256" >&2
              exit 1
            fi
            HOST_FILES+=("$archive" "$archive.sha256")
          done
          RELEASE_FILES=(
            "$ASSETS/Monoptah_${VERSION}_aarch64.zip"
            "$ASSETS/Monoptah_${VERSION}_aarch64.zip.sha256"
            "$DOWNLOADS/linux/Monoptah_${VERSION}_amd64.deb"
            "$DOWNLOADS/linux/Monoptah_${VERSION}_amd64.AppImage"
            "${RPMS[0]}"
            "$DOWNLOADS/windows/Monoptah_${VERSION}_x64-setup.exe"
            "${HOST_FILES[@]}"
          )
          for artifact in "${RELEASE_FILES[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Missing release artifact: $artifact" >&2
              exit 1
            fi
          done
          DUPLICATES=$(printf '%s\n' "${RELEASE_FILES[@]}" | xargs -n1 basename | sort | uniq -d)
          if [[ -n "$DUPLICATES" ]]; then
            echo "Duplicate release asset names:" >&2
            echo "$DUPLICATES" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${RELEASE_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Monoptah $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  host:
    name: Standalone host packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --all
        if: runner.os == 'Linux'
      - run: npm run host:package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      # The AppImage is an updater bundle. With the empty updater key in
      # tauri.conf.json a full build would be asked for
      # TAURI_SIGNING_PRIVATE_KEY, so updater artifacts are switched off.
      - name: Build Linux packages
        run: npm run build:linux -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" release-artifacts/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  linux-rpm:
    name: Linux rpm package
    runs-on: ubuntu-latest
    # Build on EL 10 so the published rpm's glibc requirement matches the
    # oldest advertised target. Fedora 43 is newer and would install on EL 10
    # while failing to load.
    container: almalinux:10
    steps:
      # almalinux:10 ships no git, which actions/checkout otherwise has to work
      # around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      - name: Build rpm package
        run: npm run build:fedora

      - name: Install and stage the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, and the setup script has already
          # installed every -devel package, so assert the metadata directly.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # No updater key exists in this fork, so updater artifacts (and their
      # .sig files) are switched off instead of signing with a missing key.
      - name: Write release config
        run: |
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $false
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Build Windows packages
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item -Path $installers[0].FullName -Destination "release-artifacts/"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error
