# Fork-local release workflow (Monoptah Native). Run by hand (workflow_dispatch),
# normally by `npm run native:release:mac -- X.Y.Z`. That script builds and
# packages the macOS app on the maintainer's Mac (GitHub-hosted macOS runners are
# not used at all), pushes the tag native-vX.Y.Z and creates the release with the
# three macOS files. This workflow builds the Linux x86_64, Windows x86_64 and rpm
# apps on CI and publishes:
#   - a GitHub Release native-vX.Y.Z with, per platform, the updater package and
#     its signature (what the in-app updater downloads):
#       macOS arm64    MonoptahNative_X.Y.Z_aarch64.app.tar.gz (+ .sig), plus the
#                      .zip and .zip.sha256 that the monoptah-native Homebrew
#                      cask pins (self-signed, not notarized: no Apple account).
#                      The three unsigned files are uploaded by the local script;
#                      this workflow only adds the .sig.
#       Linux x86_64   MonoptahNative_X.Y.Z_amd64.AppImage (+ .sig),
#                      monoptah-native_X.Y.Z_amd64.deb (+ .sig) and
#                      monoptah-native-X.Y.Z-<release>.x86_64.rpm (+ .sig), the
#                      rpm built on AlmaLinux 10 in a container
#       Windows x86_64 MonoptahNative_X.Y.Z_x64-setup.exe (+ .sig), an NSIS
#                      installer (unsigned, so SmartScreen warns)
#   - latest.json (the signed update feed) on the rolling release native-latest,
#     which is the endpoint compiled into the app. It lists all five targets
#     (darwin-aarch64-app, linux-x86_64-appimage, linux-x86_64-deb,
#     linux-x86_64-rpm, windows-x86_64-nsis) and never moves to an older version.
# Neither release is ever marked "latest" (--latest=false). The Tauri updater
# reads releases/latest/download/latest.json, so a native release becoming the
# repository's latest release would break updates for the Tauri app.
#
# Until this workflow finishes the release holds only the macOS files. The in-app
# feed and the Homebrew cask change only at the end (publish and homebrew).
#
# Two modes (inputs):
#   - Early run (sha given, request_id for the run name): the local script
#     dispatches it before native:check, so Linux, Windows and rpm build from the
#     commit while the Mac checks and builds. The tag and the release do not exist
#     yet. The await-release job waits (up to 120 minutes) for the tag, which must
#     point at the same commit, for the release and for all three macOS files in
#     state "uploaded", then requires a green native.yml push run on main for the
#     commit, then plans again. publish runs only after that, so nothing is
#     published before the local script has tagged. If the local script fails or
#     stops before tagging it cancels this run; when Ctrl-C kills it, the run
#     fails at the await limit and nothing was published.
#   - Tag only (sha empty, the old manual path): the tag and its release with the
#     macOS files must exist, and native.yml must be green for the tag's commit.
#     Use it to re-run a release whose early run is gone:
#       gh workflow run native-release-monoptah.yml --ref main -f tag=native-vX.Y.Z
#
# Why there is no push trigger: the tag is pushed before the macOS files are
# uploaded, so a tag-triggered run would race the upload.
#
# Jobs: plan (validate the inputs, resolve the commit, decide what to build),
# package (Linux and Windows matrix) and package-rpm build in parallel from the
# planned commit, await-release (in parallel with the builds, see above), then
# publish (Ubuntu) checks that the tag is the built commit, signs every updater
# package and the feed in one place, verifies them with the app's own verifier
# and publishes, then homebrew bumps the macOS-only cask. Every platform is
# required: if one package job fails nothing is published, and a re-run reuses
# the platforms that already succeeded only once they are on the release (see
# "Re-runs" below). The release notes are the body of the release (written by the
# local script); the feed carries the same text.
#
# Tools versus the built commit: the helper scripts that plan, sign and describe
# the release (native-release-monoptah.mjs, package-native-monoptah.mjs) run from
# a second checkout of the ref this workflow was dispatched on (release-tools/),
# not from the commit being released. So the tag-only dispatch also works for a
# tag cut before these scripts gained --defer-macos or macos-ready. Building and
# packaging (scripts/package-native.mjs) still use the planned commit.
#
# macOS is never built here. The plan job leaves macOS out of the matrix when its
# files are not on the release yet (early run) and fails in tag-only mode.
#
# Re-runs: published assets are never replaced. When the release already has all
# files of a platform, that platform is not rebuilt and its published files are
# downloaded and signed again; platforms with no files on the release are built.
# A platform with only some of its files published fails the plan job: delete
# its published assets by hand and re-run. The publish job also refuses to skip
# a freshly built file that is already on the release. The feed is replaced only
# by the same or a newer version. If a run fails after the release exists, the
# local script is not needed again: dispatch with the tag only (above), or re-run
# the failed jobs of the run.
#
# Only plain X.Y.Z tags are supported (no -preview.N): the cask, the checksum
# asset and the feed all assume a final version, and the cask bump script
# refuses anything else. A tag such as native-v0.34.0-preview.1 fails the first
# step.
#
# The secrets read are the two updater signing secrets, TAURI_SIGNING_PRIVATE_KEY
# and its password (they sign the updater packages and the feed with the same key
# the Tauri app trusts), the automatic GITHUB_TOKEN, and the optional
# HOMEBREW_TAP_TOKEN. HOMEBREW_TAP_TOKEN is a fine-grained personal access token
# with Contents read/write on hhoangg/homebrew-monoptah only; the homebrew job
# uses it to bump Casks/monoptah-native.rb after the release is published, and
# skips the bump (without failing the release) when it is not set. Fine-grained
# tokens expire: if the tap checkout fails, the likely cause is an expired
# HOMEBREW_TAP_TOKEN. There is no Apple signing, notarization or R2 upload here.
# Only the signing job (publish) sees the signing key; the package jobs do not,
# and the local macOS script never reads it.
#
# Build caches: this workflow is dispatched on main, so its runs read the caches
# main saved (actions/cache restores from the run's own ref and the default
# branch). Only pushes to main save them: the release-cache jobs in native.yml
# seed the Linux, Windows and rpm caches (shared keys below), and publish reads
# the Linux one for the verifier's dependencies. The jobs here never save one. A
# cache holds dependency builds only, so a miss is just slower. The rpm cache key
# also depends on the container's environment, so it must stay in step with
# release-cache-rpm in native.yml.
#
# Upstream's native-release.yml also triggers on native-v* tags; it is gated to
# the upstream repository so it does not run (and fail) on this fork.
name: Native release (Monoptah)

# The local script finds its run by the request_id in the run name.
run-name: Native release ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: native-vX.Y.Z to release. With sha it may not exist yet (npm run native:release:mac pushes it later); without sha it must exist with its release
        required: true
        type: string
      sha:
        description: Full 40-character commit to build (set by npm run native:release:mac so the build starts before the tag exists). Empty means the commit of the existing tag
        required: false
        default: ""
        type: string
      request_id:
        description: Opaque id only used in the run name, so the local script can find the run it started
        required: false
        default: ""
        type: string

# Only the publish job writes, so only it gets write access.
permissions:
  contents: read

# Concurrency. Runs of one tag never overlap (group per tag, nothing is
# cancelled): the early run and a later re-dispatch of the same tag take turns,
# and a duplicate run only sees everything published and changes nothing.
# GitHub keeps at most one running and one pending run per group: a newer
# pending run replaces (cancels) an older pending one, which is the wanted result
# for a repeated dispatch of one tag. Different tags run side by side, so the
# publish job (the only writer of the rolling feed) has its own group below to
# keep feed writes serialized across tags. The same rule applies there: if three
# publish jobs queue up, the middle one is cancelled and its tag is released
# again by dispatching it with the tag only. The homebrew job keeps the
# homebrew-tap group it shares with release.yml. Every job has a timeout so a
# hung job cannot hold a group for long (a run stuck in the queue is cancelled
# by the local script).
concurrency:
  group: native-monoptah-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  # The update feed the app polls, and the key it verifies the feed with.
  # The key is the public updater key from src-tauri/tauri.conf.json.
  NATIVE_FEED_URL: https://github.com/hhoangg/monoptah/releases/download/native-latest/latest.json
  NATIVE_UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDdDMjg4MkQ0N0E3MDA1QUYKUldTdkJYQjYxSUlvZks0RGFSU2dkQU91NnBZQitHMC9yVFNwb2swamVLbnpHU2kvVS9yNWRBZkIK

jobs:
  # Validates the inputs and decides what to build. Two modes:
  #   - sha given (early run, started by npm run native:release:mac before the
  #     tag exists): the commit is built as is. The tag may not exist yet or the
  #     release may be missing; macOS is then deferred to the await-release job.
  #     If the tag already exists it must point at that commit.
  #   - no sha (the old manual path): the tag and its release must exist, the
  #     commit is the tag's, and a green native.yml run for it is required here.
  # Only "not found" (HTTP 404) means the release does not exist; any other error
  # fails the job. A re-run after a partial failure must not rebuild and replace
  # published assets: the cask may already pin the zip, and the feed must describe
  # the packages that are actually published.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rpm: ${{ steps.plan.outputs.rpm }}
      build_any: ${{ steps.plan.outputs.build_any }}
      reuse: ${{ steps.plan.outputs.reuse }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      INPUT_SHA: ${{ inputs.sha }}
      TOOLS: release-tools/scripts
    steps:
      # Before the checkout, so a bad input never reaches it.
      - name: Check the inputs
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != native-v* ]]; then
            echo "Release tag must start with native-v" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#native-v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $RELEASE_TAG must look like native-vX.Y.Z (pre-release tags are not supported)" >&2
            exit 1
          fi
          if [[ -n "$INPUT_SHA" && ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase hex commit, got: $INPUT_SHA" >&2
            exit 1
          fi
          echo "MONOCODE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha != '' && inputs.sha || format('refs/tags/{0}', inputs.tag) }}

      # The helper scripts (planning, signing, the feed) come from the ref this
      # workflow was dispatched on, not from the commit being released: a tag cut
      # before a change to these scripts would not have the new commands, and the
      # tools must not depend on what is being built. Checked out after the main
      # checkout, which would otherwise clean it away. Building still uses the
      # planned commit.
      - name: Check out the release tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The commit is the one checked out. If the tag already exists it must
      # point at the same commit, whatever the mode.
      - name: Resolve the commit and check the tag
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [[ -n "$INPUT_SHA" && "$SHA" != "$INPUT_SHA" ]]; then
            echo "Checked out $SHA but sha input is $INPUT_SHA" >&2
            exit 1
          fi
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '[.[] | select(.ref == "refs/tags/'"$RELEASE_TAG"'")] | length')
          if [[ "$COUNT" != 0 ]]; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "Tag $RELEASE_TAG points at $TAG_SHA, not at $SHA. Nothing was built." >&2
              exit 1
            fi
          elif [[ -z "$INPUT_SHA" ]]; then
            echo "Tag $RELEASE_TAG does not exist. Without the sha input the tag must exist." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Tag-only mode: releases are cut from commits whose native.yml run on main
      # succeeded. In sha mode the await-release job checks this just before
      # publishing, because CI may still be running when this run starts.
      - name: Require a successful native.yml run for the tagged commit
        if: inputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if ! node "$TOOLS/native-release-monoptah.mjs" ci-gate "$SHA"; then
            echo "The native.yml check for commit $SHA failed (see above). Wait for native.yml to pass, then release again." >&2
            exit 1
          fi

      - name: Look for the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/published.txt"
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo "::notice::Release $RELEASE_TAG exists; its published assets are reused and none is replaced."
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published.txt"
          elif grep -q "HTTP 404" <<<"$out"; then
            if [[ -z "$INPUT_SHA" ]]; then
              echo "Release $RELEASE_TAG does not exist. The macOS files are built on the maintainer's Mac: run 'npm run native:release:mac -- ${RELEASE_TAG#native-v}' from a clean main checkout." >&2
              exit 1
            fi
            echo "::notice::Release $RELEASE_TAG does not exist yet; the local script creates it with the macOS files. Linux and Windows build meanwhile."
          else
            echo "$out" >&2
            exit 1
          fi

      # Prints matrix, rpm, build_any and reuse. A platform is built unless the
      # release already has every one of its files. In tag-only mode the command
      # fails when macOS would have to be built; in sha mode macOS is left out
      # until the await-release job sees its files.
      - name: Decide which platforms to build
        id: plan
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ -n "$INPUT_SHA" ]]; then FLAGS+=(--defer-macos); fi
          # pipefail makes a failing plan fail the step.
          node "$TOOLS/native-release-monoptah.mjs" plan "${FLAGS[@]}" "$RUNNER_TEMP/published.txt" | tee -a "$GITHUB_OUTPUT"

  # Linux x86_64 and Windows x86_64 (macOS is built locally, and the plan job
  # keeps it out of the matrix). No signing key here: these jobs only build and
  # package, and publish signs what they upload.
  package:
    name: Package ${{ matrix.kind }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Set before the cache step so the cache key sees the same flags as the
      # seeding job in native.yml.
      - name: Link the Windows C runtime statically
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The shared keys match the release-cache job in native.yml, which seeds
      # them from main. A release run only reads them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: ${{ format('native-monoptah-release-{0}', matrix.target) }}
          save-if: false

      - name: Configure version and update feed
        shell: bash
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"

      - name: Install native Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Install native Windows packaging tools
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release

      # Upstream's packager: it accepts plain X.Y.Z versions, checks the embedded
      # version, and writes the AppImage and deb (linux) or the NSIS installer
      # (windows) plus artifacts-<kind>-<arch>.json with the feed targets.
      - name: Package the Linux and Windows installers
        shell: bash
        run: |
          set -euo pipefail
          BINARY="crates/monocode-gpui/target/${{ matrix.target }}/release/monocode-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          node scripts/package-native.mjs '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'

      # Only the packages and their metadata; the work/ directory with the
      # staged trees stays behind.
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.kind }}
          path: |
            native-dist/artifacts-*.json
            native-dist/MonoptahNative_*
            native-dist/monoptah-native*
          if-no-files-found: error

  # Enterprise Linux rpm, built the way upstream does: AlmaLinux 10 in a
  # container. The file name carries the container's dist tag (for example
  # el10), so the plan matches it by pattern. The release is "0.preview.0"
  # because upstream's spec is written for previews; the file is still an
  # ordinary rpm of the plain X.Y.Z version.
  package-rpm:
    name: Package rpm
    needs: plan
    if: needs.plan.outputs.rpm == 'true'
    runs-on: ubuntu-latest
    container: almalinux:10
    timeout-minutes: 90
    # CARGO_BUILD_JOBS=2 was removed for speed (the build took 16 minutes cold):
    # the Linux package job builds the same crate on the same-size hosted runner
    # without a limit. If CI shows an out-of-memory kill here, restore it, in
    # release-cache-rpm in native.yml too (the job env is part of the cache key).
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl tar zstd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Seeded from main by release-cache-rpm in native.yml. Needs tar and zstd
      # in the container (installed above).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-rpm-el10
          save-if: false
      - name: Configure version and update feed
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"
      - run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release
      - run: node scripts/package-native.mjs rpm crates/monocode-gpui/target/release/monocode-gpui native-dist x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: platform-rpm
          path: |
            native-dist/artifacts-*.json
            native-dist/monoptah-native*
          if-no-files-found: error

  # Runs in parallel with the builds. It waits until the local script has pushed
  # the tag and created the release with all three macOS files (state
  # "uploaded"), then requires a successful native.yml push run on main for the
  # commit, then plans again with the final list of published files. It has no
  # secret but the workflow token and cannot write. It fails at once when the tag
  # points at another commit, and after AWAIT_LIMIT_MINUTES when the tag, the
  # release or the files never came: the local script stopped before tagging or
  # failed, and nothing was published. A partial set of macOS files is waited for
  # like an absent one. Only HTTP 404 means the release is absent.
  await-release:
    name: Wait for the macOS files and CI
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      AWAIT_LIMIT_MINUTES: "120"
      PLAN_SHA: ${{ needs.plan.outputs.sha }}
      TOOLS: release-tools/scripts
    outputs:
      reuse: ${{ steps.final.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      # The helper scripts (planning, signing, the feed) come from the ref this
      # workflow was dispatched on, not from the commit being released: a tag cut
      # before a change to these scripts would not have the new commands, and the
      # tools must not depend on what is being built. Checked out after the main
      # checkout, which would otherwise clean it away. Building still uses the
      # planned commit.
      - name: Check out the release tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the tag, the release and the macOS files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#native-v}"
          echo "MONOCODE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          export MONOCODE_NATIVE_VERSION="$VERSION"
          # Reads of the GitHub API are retried (3 tries, 10 seconds apart), so a
          # transient error does not fail a wait of up to two hours.
          # Only the output of a successful attempt is printed: gh prints the
          # error JSON to stdout on an HTTP error, which must not reach the caller.
          retry() {
            local n out
            for n in 1 2 3; do
              if out=$("$@"); then printf '%s\n' "$out"; return 0; fi
              if (( n < 3 )); then sleep 10; fi
            done
            return 1
          }
          # Reads the assets of the release into assets.json. Returns 0 when it
          # exists, 44 when it does not (only HTTP 404 means that, and it is never
          # retried), 1 for any other error after the retries.
          fetch_release() {
            local n
            for n in 1 2 3; do
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .assets > "$RUNNER_TEMP/assets.json" 2> "$RUNNER_TEMP/release.err"; then return 0; fi
              if grep -q "HTTP 404" "$RUNNER_TEMP/release.err"; then return 44; fi
              if (( n < 3 )); then sleep 10; fi
            done
            return 1
          }
          DEADLINE=$(( $(date +%s) + AWAIT_LIMIT_MINUTES * 60 ))
          while true; do
            STATE="the tag $RELEASE_TAG does not exist yet"
            COUNT=$(retry gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '[.[] | select(.ref == "refs/tags/'"$RELEASE_TAG"'")] | length') || { echo "Could not read the tag $RELEASE_TAG from the GitHub API." >&2; exit 1; }
            if [[ "$COUNT" != 0 ]]; then
              TAG_SHA=$(retry gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha) || { echo "Could not resolve the tag $RELEASE_TAG." >&2; exit 1; }
              if [[ "$TAG_SHA" != "$PLAN_SHA" ]]; then
                echo "Tag $RELEASE_TAG points at $TAG_SHA, not at $PLAN_SHA. Nothing was published." >&2
                exit 1
              fi
              STATE="the release $RELEASE_TAG does not exist yet"
              RC=0
              fetch_release || RC=$?
              if (( RC == 0 )); then
                # A failing helper must fail the job, not read as "not ready".
                READY=$(node "$TOOLS/native-release-monoptah.mjs" macos-ready "$RUNNER_TEMP/assets.json") || { echo "macos-ready failed" >&2; exit 1; }
                if [[ "$READY" == true ]]; then
                  echo "The tag and the release with all macOS files are there."
                  break
                fi
                STATE="the release does not hold all three uploaded macOS files yet"
              elif (( RC != 44 )); then
                cat "$RUNNER_TEMP/release.err" >&2
                exit 1
              fi
            fi
            if (( $(date +%s) >= DEADLINE )); then
              echo "Gave up after $AWAIT_LIMIT_MINUTES minutes: $STATE. The local script (npm run native:release:mac) probably stopped before tagging or failed; nothing was published. Run it again." >&2
              exit 1
            fi
            echo "Waiting: $STATE."
            sleep 30
          done

      - name: Require a successful native.yml run for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node "$TOOLS/native-release-monoptah.mjs" ci-gate "$PLAN_SHA"; then
            echo "The native.yml check for commit $PLAN_SHA failed (see above). Nothing was published." >&2
            exit 1
          fi

      # The macOS files are on the release now, so macOS must be reused. The
      # result must build exactly what the plan job built.
      - name: Plan again with the published files
        id: final
        env:
          PLANNED_MATRIX: ${{ needs.plan.outputs.matrix }}
          PLANNED_RPM: ${{ needs.plan.outputs.rpm }}
        run: |
          set -euo pipefail
          jq -r '.[].name' "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/published.txt"
          node "$TOOLS/native-release-monoptah.mjs" plan --check-planned "$RUNNER_TEMP/published.txt" | tee -a "$GITHUB_OUTPUT"

  # The only job with the signing key and write access. It runs on Ubuntu and
  # signs every updater package and the feed (macOS files included, taken from
  # the release), checks them with the app's own verifier, then publishes.
  # Skipped packaging jobs are fine (a platform whose files were already
  # published); a failed or cancelled one stops the release.
  publish:
    name: Sign and publish Monoptah Native
    needs: [plan, package, package-rpm, await-release]
    if: ${{ !cancelled() && needs.await-release.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TOOLS: release-tools/scripts
    # Feed and release writes of different tags never overlap.
    concurrency:
      group: native-monoptah-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      # The helper scripts (planning, signing, the feed) come from the ref this
      # workflow was dispatched on, not from the commit being released: a tag cut
      # before a change to these scripts would not have the new commands, and the
      # tools must not depend on what is being built. Checked out after the main
      # checkout, which would otherwise clean it away. Building still uses the
      # planned commit.
      - name: Check out the release tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-tools

      # The tag exists here (await-release saw it). It must still be the commit
      # that was planned and built, or the build would not match the tag.
      - name: Check the tag is the commit that was built
        env:
          PLAN_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ "$HEAD_SHA" != "$PLAN_SHA" ]]; then
            echo "Tag $RELEASE_TAG is at $HEAD_SHA but $PLAN_SHA was built. Nothing was signed or published." >&2
            exit 1
          fi

      - name: Configure version
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The verifier builds the app's update client, which links libdbus.
      - name: Install verifier build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config

      # The release-cache job in native.yml seeds this (the Linux key) from main
      # and a release run never saves one. It holds dependency builds only; a miss is just slower.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-x86_64-unknown-linux-gnu
          save-if: false

      - run: npm ci

      - name: Test the release scripts
        run: |
          set -euo pipefail
          # The tests of the tools that are used below; they look for node_modules
          # (the Tauri CLI) next to the tools.
          ln -sfn "$PWD/node_modules" release-tools/node_modules
          node --test release-tools/scripts/package-native-monoptah.test.mjs release-tools/scripts/native-release-monoptah.test.mjs

      - name: Download the packages built by this run
        if: needs.plan.outputs.build_any == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          merge-multiple: true
          path: native-dist

      # Re-run path: take the files of already published platforms from the
      # release instead of building them again. The signing step below signs
      # these exact bytes. The macOS zip is checked against its published
      # checksum, which is what the cask pins.
      - name: Download the published assets of platforms that were not rebuilt
        if: needs.await-release.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.await-release.outputs.reuse }}
        run: |
          set -euo pipefail
          set -f
          mkdir -p native-dist
          for name in $REUSE; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir native-dist
          done
          SUM="native-dist/MonoptahNative_${MONOCODE_NATIVE_VERSION}_aarch64.zip.sha256"
          if [[ -f "$SUM" ]]; then
            (cd native-dist && sha256sum -c "$(basename "$SUM")")
          fi

      # Metadata for the platforms taken from the release (the package jobs wrote
      # their own).
      - name: Describe the reused assets
        run: node "$TOOLS/native-release-monoptah.mjs" records native-dist

      # The release notes are the body of the release, written by the local script
      # (generated from the merged PR titles). The feed carries the same text, so
      # it is read from the release and not from the repository. The sign step
      # checks that it starts with the heading of this version.
      - name: Read the release notes from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .body > "$RUNNER_TEMP/release-notes.md"

      # Signs every updater package and the feed with the Tauri updater key. A
      # missing key, a missing platform or an unexpected file name fails the
      # step, so no unsigned or partial update can be published.
      - name: Sign the updater packages and the feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node "$TOOLS/native-release-monoptah.mjs" sign native-dist "$RUNNER_TEMP/release-notes.md"

      # Checks the feed and all five packages with the app's own verifier and the
      # public key compiled into the app. This stays on the native-dev profile:
      # building the example with --release --target recompiled about 90 crates
      # anyway (cargo unifies features per invocation), so it saved nothing.
      - name: Verify the signed feed with the native client
        run: cargo run --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --example verify_monoptah_native_update --profile native-dev -- native-dist

      # Kept for manual recovery if a publish step below fails: the signed
      # packages, zip, checksum and feed. Contains signatures only, no secrets.
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ env.MONOCODE_NATIVE_VERSION }}
          path: |
            native-dist/MonoptahNative_*
            native-dist/monoptah-native*
            native-dist/latest.json
            native-dist/release-files.json
          retention-days: 30
          if-no-files-found: error
          # A re-run of the failed job uploads under the same name again.
          overwrite: true

      # Never replaces a published asset: the release always exists here (the
      # local macOS script created it, and await-release checks), and only assets
      # that are missing from it are uploaded (no --clobber), so the zip a cask
      # pinned cannot change. The release is created by the local script with
      # --latest=false, which keeps it away from releases/latest (the Tauri
      # feed). If it was deleted after await-release, gh release view fails the
      # step; nothing is created here.
      - name: Publish the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.await-release.outputs.reuse }}
        run: |
          set -euo pipefail
          set -f
          FILES=()
          LIST=$(node -e 'for (const f of JSON.parse(require("fs").readFileSync("native-dist/release-files.json", "utf8"))) console.log(f)') || { echo "Could not read release-files.json" >&2; exit 1; }
          while IFS= read -r file; do
            FILES+=("native-dist/$file")
          done <<<"$LIST"
          EXPECTED=$(node "$TOOLS/native-release-monoptah.mjs" file-count) || { echo "file-count failed" >&2; exit 1; }
          if (( ${#FILES[@]} != EXPECTED )); then
            echo "Expected $EXPECTED release files, got ${#FILES[@]}" >&2
            exit 1
          fi
          PUBLISHED=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          # Only files taken from the release may already be on it. A freshly
          # built file (or its .sig) that is already published would be silently
          # skipped below while the feed signs the new bytes.
          for file in "${FILES[@]}"; do
            name=$(basename "$file")
            base="${name%.sig}"
            if grep -Fxq "$name" <<<"$PUBLISHED" && ! grep -Fxq "$base" <<<"$(tr ' ' '\n' <<<"$REUSE")"; then
              echo "$name was built by this run but is already published on $RELEASE_TAG; refusing to publish different bytes. Delete that platform's assets from the release by hand and re-run." >&2
              exit 1
            fi
          done
          MISSING=()
          for file in "${FILES[@]}"; do
            if ! grep -Fxq "$(basename "$file")" <<<"$PUBLISHED"; then
              MISSING+=("$file")
            fi
          done
          if (( ${#MISSING[@]} > 0 )); then
            gh release upload "$RELEASE_TAG" "${MISSING[@]}" --repo "$GITHUB_REPOSITORY"
          fi

      # The only mutable asset. It is written after the versioned release exists
      # so the feed never points at a missing file. The rolling release is a
      # published pre-release so it is never the repository's latest release.
      # The feed is not replaced when it already advertises a newer version, so
      # re-running an old tag cannot downgrade it. Replacing the asset leaves a
      # short window in which the feed URL answers 404; the app retries later.
      # Only "release not found" and "no latest.json asset yet" mean there is no
      # feed to compare with; every other error fails the step.
      - name: Publish the rolling update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/native-latest" 2>&1); then
            :
          elif grep -q "HTTP 404" <<<"$out"; then
            gh release create native-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --prerelease \
              --title "Monoptah Native update feed" \
              --notes "Rolling release that holds latest.json, the signed update feed read by Monoptah Native. Do not download from here; use the native-vX.Y.Z releases."
          else
            echo "$out" >&2
            exit 1
          fi
          EXISTING="$RUNNER_TEMP/existing-feed"
          rm -rf "$EXISTING"
          mkdir -p "$EXISTING"
          ASSETS=$(gh release view native-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq latest.json <<<"$ASSETS"; then
            gh release download native-latest --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$EXISTING"
          fi
          # A crash or empty output here must fail the step, not skip the feed.
          RESULT=$(node "$TOOLS/native-release-monoptah.mjs" feed-supersedes native-dist/latest.json "$EXISTING/latest.json") || { echo "feed-supersedes failed" >&2; exit 1; }
          case "$RESULT" in
            true) ;;
            false)
              echo "::notice::native-latest already advertises a newer version than $MONOCODE_NATIVE_VERSION, so the feed was left as is."
              exit 0
              ;;
            *)
              echo "Unexpected feed-supersedes result: '$RESULT'" >&2
              exit 1
              ;;
          esac
          gh release upload native-latest native-dist/latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # Bumps the Homebrew cask to the version just published. It runs only after the
  # release exists. The release is already published by the time this job
  # starts, so a tap failure (for example an expired HOMEBREW_TAP_TOKEN) only
  # turns the workflow run red; it cannot undo or block the release. The cask
  # pins the sha256 published next to the zip, so that asset is the source of
  # truth. The script never lowers the version, so re-running an old tag cannot
  # downgrade the cask. It shares the homebrew-tap group with release.yml.
  homebrew:
    name: Update Homebrew cask
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Homebrew tap token
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::notice::Homebrew tap was not updated: the HOMEBREW_TAP_TOKEN secret is not set. To enable it, add a fine-grained personal access token with Contents read/write on hhoangg/homebrew-monoptah only as a repository secret named HOMEBREW_TAP_TOKEN. Until then, bump Casks/monoptah-native.rb by hand."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Read published sha256
        id: sha
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#native-v}"
          DIR="$RUNNER_TEMP/tap-sha"
          mkdir -p "$DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "MonoptahNative_${V}_aarch64.zip.sha256" \
            --dir "$DIR"
          SHA=$(awk 'NR == 1 { print $1 }' "$DIR/MonoptahNative_${V}_aarch64.zip.sha256")
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Published sha256 is not 64 lowercase hex characters: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # If this step fails, the likely cause is an expired HOMEBREW_TAP_TOKEN
      # (fine-grained tokens have an expiry date).
      - name: Check out Homebrew tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: hhoangg/homebrew-monoptah
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask and push
        if: steps.gate.outputs.enabled == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#native-v}"
          bash scripts/update-homebrew-cask.sh homebrew-tap/Casks/monoptah-native.rb "$V" "$SHA"
          cd homebrew-tap
          if git diff --quiet; then
            echo "Cask already pins $V, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Casks/monoptah-native.rb
          git commit -m "Update Monoptah Native to $V"
          # Rebase onto the tap's main before pushing, and retry once when the
          # push is rejected because someone else pushed in between.
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying." >&2
          done
          echo "Could not push the cask update to the tap." >&2
          exit 1
