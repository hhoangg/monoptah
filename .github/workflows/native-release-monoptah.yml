# Fork-local release workflow (Monoptah Native). Run by hand (workflow_dispatch)
# with the tag input, normally by `npm run native:release:mac -- X.Y.Z`, which
# builds and packages the macOS app on the maintainer's Mac (GitHub-hosted macOS
# runners are not used at all), pushes the tag native-vX.Y.Z, creates the release
# with the three macOS files and dispatches this workflow. It then builds the
# Linux x86_64 and Windows x86_64 apps on CI and publishes:
#   - a GitHub Release native-vX.Y.Z with, per platform, the updater package and
#     its signature (what the in-app updater downloads):
#       macOS arm64    MonoptahNative_X.Y.Z_aarch64.app.tar.gz (+ .sig), plus the
#                      .zip and .zip.sha256 that the monoptah-native Homebrew
#                      cask pins (ad-hoc signed, not notarized: no Apple account).
#                      The three unsigned files are uploaded by the local script;
#                      this workflow only adds the .sig.
#       Linux x86_64   MonoptahNative_X.Y.Z_amd64.AppImage (+ .sig),
#                      monoptah-native_X.Y.Z_amd64.deb (+ .sig) and
#                      monoptah-native-X.Y.Z-<release>.x86_64.rpm (+ .sig), the
#                      rpm built on AlmaLinux 10 in a container
#       Windows x86_64 MonoptahNative_X.Y.Z_x64-setup.exe (+ .sig), an NSIS
#                      installer (unsigned, so SmartScreen warns)
#   - latest.json (the signed update feed) on the rolling release native-latest,
#     which is the endpoint compiled into the app. It lists all five targets
#     (darwin-aarch64-app, linux-x86_64-appimage, linux-x86_64-deb,
#     linux-x86_64-rpm, windows-x86_64-nsis) and never moves to an older version.
# Neither release is ever marked "latest" (--latest=false). The Tauri updater
# reads releases/latest/download/latest.json, so a native release becoming the
# repository's latest release would break updates for the Tauri app.
#
# Until this workflow finishes the release holds only the macOS files. The in-app
# feed and the Homebrew cask change only at the end (publish and homebrew).
#
# Why there is no push trigger: the tag is pushed before the macOS files are
# uploaded, so a tag-triggered run would race the upload. The workflow is
# dispatched after the upload instead.
#
# Jobs: plan (validate the tag, require a green native.yml push run on main for
# the tagged commit, require the release with all macOS files), package (Linux and
# Windows matrix) and package-rpm build in parallel, publish (Ubuntu) signs every
# updater package and the feed in one place, verifies them with the app's own
# verifier and publishes, then homebrew bumps the macOS-only cask. Every
# platform is required: if one package job fails nothing is published, and a
# re-run reuses the platforms that already succeeded only once they are on the
# release (see "Re-runs" below).
#
# macOS is never built here. The plan job fails unless the release already has
# the three macOS files, and tells the operator to run the local script.
#
# Re-runs: published assets are never replaced. When the release already has all
# files of a platform, that platform is not rebuilt and its published files are
# downloaded and signed again; platforms with no files on the release are built.
# A platform with only some of its files published fails the plan job: delete
# its published assets by hand and re-run. The publish job also refuses to skip
# a freshly built file that is already on the release. The feed is replaced only
# by the same or a newer version.
#
# Only plain X.Y.Z tags are supported (no -preview.N): the cask, the checksum
# asset and the feed all assume a final version, and the cask bump script
# refuses anything else. A tag such as native-v0.34.0-preview.1 fails the first
# step.
#
# The secrets read are the two updater signing secrets, TAURI_SIGNING_PRIVATE_KEY
# and its password (they sign the updater packages and the feed with the same key
# the Tauri app trusts), the automatic GITHUB_TOKEN, and the optional
# HOMEBREW_TAP_TOKEN. HOMEBREW_TAP_TOKEN is a fine-grained personal access token
# with Contents read/write on hhoangg/homebrew-monoptah only; the homebrew job
# uses it to bump Casks/monoptah-native.rb after the release is published, and
# skips the bump (without failing the release) when it is not set. Fine-grained
# tokens expire: if the tap checkout fails, the likely cause is an expired
# HOMEBREW_TAP_TOKEN. There is no Apple signing, notarization or R2 upload here.
# Only the signing job (publish) sees the signing key; the package jobs do not,
# and the local macOS script never reads it.
#
# Build caches: this workflow is dispatched on main, so its runs read the caches
# main saved (actions/cache restores from the run's own ref and the default
# branch). Only pushes to main save them: the release-cache jobs in native.yml
# seed the Linux, Windows and rpm caches (shared keys below), and publish reads
# the Linux one for the verifier's dependencies. The jobs here never save one. A
# cache holds dependency builds only, so a miss is just slower. The rpm cache key
# also depends on the container's environment, so it must stay in step with
# release-cache-rpm in native.yml.
#
# Upstream's native-release.yml also triggers on native-v* tags; it is gated to
# the upstream repository so it does not run (and fail) on this fork.
name: Native release (Monoptah)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native-vX.Y.Z tag to release (pushed with its macOS files by npm run native:release:mac)
        required: true
        type: string

# Only the publish job writes, so only it gets write access.
permissions:
  contents: read

# Runs are serialized so the rolling feed and the cask cannot be written by two
# tags at once.
concurrency:
  group: native-monoptah-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  # The update feed the app polls, and the key it verifies the feed with.
  # The key is the public updater key from src-tauri/tauri.conf.json.
  NATIVE_FEED_URL: https://github.com/hhoangg/monoptah/releases/download/native-latest/latest.json
  NATIVE_UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDdDMjg4MkQ0N0E3MDA1QUYKUldTdkJYQjYxSUlvZks0RGFSU2dkQU91NnBZQitHMC9yVFNwb2swamVLbnpHU2kvVS9yNWRBZkIK

jobs:
  # Validates the tag, requires a green CI run for the tagged commit, and decides
  # what to build. The release must already exist with its macOS files (uploaded
  # by npm run native:release:mac), and macOS is never built here. A re-run after
  # a partial failure (for example the feed step failing after the release was
  # created) must not rebuild and replace published assets: the cask may already
  # pin the zip, and the feed must describe the packages that are actually
  # published. Only "not found" (HTTP 404) means the release does not exist; any
  # other error fails the job.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rpm: ${{ steps.plan.outputs.rpm }}
      build_any: ${{ steps.plan.outputs.build_any }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag is a plain native release version
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != native-v* ]]; then
            echo "Release tag must start with native-v" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#native-v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $RELEASE_TAG must look like native-vX.Y.Z (pre-release tags are not supported)" >&2
            exit 1
          fi
          echo "MONOCODE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # The notes must be about this version; the sign step checks the heading
          # again, but failing here saves a full build.
          head -n 1 docs/native/monoptah-release-notes.md | grep -Fxq "# Monoptah Native $VERSION" || {
            echo "docs/native/monoptah-release-notes.md must start with '# Monoptah Native $VERSION'" >&2
            exit 1
          }

      # Releases are cut from commits whose native.yml run on main succeeded. The
      # commit is the one checked out (the tag's), not the dispatching ref's.
      - name: Require a successful native.yml run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native.yml/runs?head_sha=$SHA&event=push&branch=main&status=success&per_page=1" --jq .total_count)
          if [[ "$COUNT" -lt 1 ]]; then
            echo "native.yml has no successful push run on main for commit $SHA. Wait for it to pass, then release again." >&2
            exit 1
          fi

      - name: Look for the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/published.txt"
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo "::notice::Release $RELEASE_TAG exists; its published assets are reused and none is replaced."
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published.txt"
          elif grep -q "HTTP 404" <<<"$out"; then
            echo "Release $RELEASE_TAG does not exist. The macOS files are built on the maintainer's Mac: run 'npm run native:release:mac -- ${RELEASE_TAG#native-v}' from a clean main checkout." >&2
            exit 1
          else
            echo "$out" >&2
            exit 1
          fi

      # Prints matrix, rpm, build_any and reuse. A platform is built unless the
      # release already has every one of its files. The command fails when macOS
      # would have to be built.
      - name: Decide which platforms to build
        id: plan
        run: |
          set -euo pipefail
          node scripts/native-release-monoptah.mjs plan "$RUNNER_TEMP/published.txt" | tee -a "$GITHUB_OUTPUT"

  # Linux x86_64 and Windows x86_64 (macOS is built locally, and the plan job
  # keeps it out of the matrix). No signing key here: these jobs only build and
  # package, and publish signs what they upload.
  package:
    name: Package ${{ matrix.kind }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Set before the cache step so the cache key sees the same flags as the
      # seeding job in native.yml.
      - name: Link the Windows C runtime statically
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The shared keys match the release-cache job in native.yml, which seeds
      # them from main. A release run only reads them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: ${{ format('native-monoptah-release-{0}', matrix.target) }}
          save-if: false

      - name: Configure version and update feed
        shell: bash
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"

      - name: Install native Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Install native Windows packaging tools
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release

      # Upstream's packager: it accepts plain X.Y.Z versions, checks the embedded
      # version, and writes the AppImage and deb (linux) or the NSIS installer
      # (windows) plus artifacts-<kind>-<arch>.json with the feed targets.
      - name: Package the Linux and Windows installers
        shell: bash
        run: |
          set -euo pipefail
          BINARY="crates/monocode-gpui/target/${{ matrix.target }}/release/monocode-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          node scripts/package-native.mjs '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'

      # Only the packages and their metadata; the work/ directory with the
      # staged trees stays behind.
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.kind }}
          path: |
            native-dist/artifacts-*.json
            native-dist/MonoptahNative_*
            native-dist/monoptah-native*
          if-no-files-found: error

  # Enterprise Linux rpm, built the way upstream does: AlmaLinux 10 in a
  # container. The file name carries the container's dist tag (for example
  # el10), so the plan matches it by pattern. The release is "0.preview.0"
  # because upstream's spec is written for previews; the file is still an
  # ordinary rpm of the plain X.Y.Z version.
  package-rpm:
    name: Package rpm
    needs: plan
    if: needs.plan.outputs.rpm == 'true'
    runs-on: ubuntu-latest
    container: almalinux:10
    timeout-minutes: 90
    # CARGO_BUILD_JOBS=2 was removed for speed (the build took 16 minutes cold):
    # the Linux package job builds the same crate on the same-size hosted runner
    # without a limit. If CI shows an out-of-memory kill here, restore it, in
    # release-cache-rpm in native.yml too (the job env is part of the cache key).
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl tar zstd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Seeded from main by release-cache-rpm in native.yml. Needs tar and zstd
      # in the container (installed above).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-rpm-el10
          save-if: false
      - name: Configure version and update feed
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"
      - run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release
      - run: node scripts/package-native.mjs rpm crates/monocode-gpui/target/release/monocode-gpui native-dist x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: platform-rpm
          path: |
            native-dist/artifacts-*.json
            native-dist/monoptah-native*
          if-no-files-found: error

  # The only job with the signing key and write access. It runs on Ubuntu and
  # signs every updater package and the feed (macOS files included, taken from
  # the release), checks them with the app's own verifier, then publishes.
  # Skipped packaging jobs are fine (a platform whose files were already
  # published); a failed or cancelled one stops the release.
  publish:
    name: Sign and publish Monoptah Native
    needs: [plan, package, package-rpm]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Configure version
        run: |
          set -euo pipefail
          echo "MONOCODE_NATIVE_VERSION=${RELEASE_TAG#native-v}" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_ENDPOINT=$NATIVE_FEED_URL" >> "$GITHUB_ENV"
          echo "MONOCODE_NATIVE_UPDATER_PUBKEY=$NATIVE_UPDATER_PUBKEY" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The verifier builds the app's update client, which links libdbus.
      - name: Install verifier build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config

      # The release-cache job in native.yml seeds this (the Linux key) from main
      # and a release run never saves one. It holds dependency builds only; a miss is just slower.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          shared-key: native-monoptah-release-x86_64-unknown-linux-gnu
          save-if: false

      - run: npm ci

      - name: Test the release scripts
        run: node --test scripts/package-native-monoptah.test.mjs scripts/native-release-monoptah.test.mjs

      - name: Download the packages built by this run
        if: needs.plan.outputs.build_any == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          merge-multiple: true
          path: native-dist

      # Re-run path: take the files of already published platforms from the
      # release instead of building them again. The signing step below signs
      # these exact bytes. The macOS zip is checked against its published
      # checksum, which is what the cask pins.
      - name: Download the published assets of platforms that were not rebuilt
        if: needs.plan.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          set -f
          mkdir -p native-dist
          for name in $REUSE; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir native-dist
          done
          SUM="native-dist/MonoptahNative_${MONOCODE_NATIVE_VERSION}_aarch64.zip.sha256"
          if [[ -f "$SUM" ]]; then
            (cd native-dist && sha256sum -c "$(basename "$SUM")")
          fi

      # Metadata for the platforms taken from the release (the package jobs wrote
      # their own).
      - name: Describe the reused assets
        run: node scripts/native-release-monoptah.mjs records native-dist

      # Signs every updater package and the feed with the Tauri updater key. A
      # missing key, a missing platform or an unexpected file name fails the
      # step, so no unsigned or partial update can be published.
      - name: Sign the updater packages and the feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/native-release-monoptah.mjs sign native-dist docs/native/monoptah-release-notes.md

      # Checks the feed and all five packages with the app's own verifier and the
      # public key compiled into the app. This stays on the native-dev profile:
      # building the example with --release --target recompiled about 90 crates
      # anyway (cargo unifies features per invocation), so it saved nothing.
      - name: Verify the signed feed with the native client
        run: cargo run --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-core --example verify_monoptah_native_update --profile native-dev -- native-dist

      # Kept for manual recovery if a publish step below fails: the signed
      # packages, zip, checksum and feed. Contains signatures only, no secrets.
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ env.MONOCODE_NATIVE_VERSION }}
          path: |
            native-dist/MonoptahNative_*
            native-dist/monoptah-native*
            native-dist/latest.json
            native-dist/release-files.json
          retention-days: 30
          if-no-files-found: error
          # A re-run of the failed job uploads under the same name again.
          overwrite: true

      # Never replaces a published asset: the release always exists here (the
      # local macOS script created it, and the plan job checks), and only assets
      # that are missing from it are uploaded (no --clobber), so the zip a cask
      # pinned cannot change. The release is created by the local script with
      # --latest=false, which keeps it away from releases/latest (the Tauri
      # feed). If it was deleted after the plan job, gh release view fails the
      # step; nothing is created here.
      - name: Publish the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          set -f
          FILES=()
          while IFS= read -r file; do
            FILES+=("native-dist/$file")
          done < <(node -e 'for (const f of JSON.parse(require("fs").readFileSync("native-dist/release-files.json", "utf8"))) console.log(f)')
          EXPECTED=$(node scripts/native-release-monoptah.mjs file-count)
          if (( ${#FILES[@]} != EXPECTED )); then
            echo "Expected $EXPECTED release files, got ${#FILES[@]}" >&2
            exit 1
          fi
          PUBLISHED=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          # Only files taken from the release may already be on it. A freshly
          # built file (or its .sig) that is already published would be silently
          # skipped below while the feed signs the new bytes.
          for file in "${FILES[@]}"; do
            name=$(basename "$file")
            base="${name%.sig}"
            if grep -Fxq "$name" <<<"$PUBLISHED" && ! grep -Fxq "$base" <<<"$(tr ' ' '\n' <<<"$REUSE")"; then
              echo "$name was built by this run but is already published on $RELEASE_TAG; refusing to publish different bytes. Delete that platform's assets from the release by hand and re-run." >&2
              exit 1
            fi
          done
          MISSING=()
          for file in "${FILES[@]}"; do
            if ! grep -Fxq "$(basename "$file")" <<<"$PUBLISHED"; then
              MISSING+=("$file")
            fi
          done
          if (( ${#MISSING[@]} > 0 )); then
            gh release upload "$RELEASE_TAG" "${MISSING[@]}" --repo "$GITHUB_REPOSITORY"
          fi

      # The only mutable asset. It is written after the versioned release exists
      # so the feed never points at a missing file. The rolling release is a
      # published pre-release so it is never the repository's latest release.
      # The feed is not replaced when it already advertises a newer version, so
      # re-running an old tag cannot downgrade it. Replacing the asset leaves a
      # short window in which the feed URL answers 404; the app retries later.
      # Only "release not found" and "no latest.json asset yet" mean there is no
      # feed to compare with; every other error fails the step.
      - name: Publish the rolling update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/native-latest" 2>&1); then
            :
          elif grep -q "HTTP 404" <<<"$out"; then
            gh release create native-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --prerelease \
              --title "Monoptah Native update feed" \
              --notes "Rolling release that holds latest.json, the signed update feed read by Monoptah Native. Do not download from here; use the native-vX.Y.Z releases."
          else
            echo "$out" >&2
            exit 1
          fi
          EXISTING="$RUNNER_TEMP/existing-feed"
          rm -rf "$EXISTING"
          mkdir -p "$EXISTING"
          ASSETS=$(gh release view native-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq latest.json <<<"$ASSETS"; then
            gh release download native-latest --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$EXISTING"
          fi
          # A crash or empty output here must fail the step, not skip the feed.
          RESULT=$(node scripts/native-release-monoptah.mjs feed-supersedes native-dist/latest.json "$EXISTING/latest.json")
          case "$RESULT" in
            true) ;;
            false)
              echo "::notice::native-latest already advertises a newer version than $MONOCODE_NATIVE_VERSION, so the feed was left as is."
              exit 0
              ;;
            *)
              echo "Unexpected feed-supersedes result: '$RESULT'" >&2
              exit 1
              ;;
          esac
          gh release upload native-latest native-dist/latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # Bumps the Homebrew cask to the version just published. It runs only after the
  # release exists. The release is already published by the time this job
  # starts, so a tap failure (for example an expired HOMEBREW_TAP_TOKEN) only
  # turns the workflow run red; it cannot undo or block the release. The cask
  # pins the sha256 published next to the zip, so that asset is the source of
  # truth. The script never lowers the version, so re-running an old tag cannot
  # downgrade the cask. It shares the homebrew-tap group with release.yml.
  homebrew:
    name: Update Homebrew cask
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Homebrew tap token
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::notice::Homebrew tap was not updated: the HOMEBREW_TAP_TOKEN secret is not set. To enable it, add a fine-grained personal access token with Contents read/write on hhoangg/homebrew-monoptah only as a repository secret named HOMEBREW_TAP_TOKEN. Until then, bump Casks/monoptah-native.rb by hand."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Read published sha256
        id: sha
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#native-v}"
          DIR="$RUNNER_TEMP/tap-sha"
          mkdir -p "$DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "MonoptahNative_${V}_aarch64.zip.sha256" \
            --dir "$DIR"
          SHA=$(awk 'NR == 1 { print $1 }' "$DIR/MonoptahNative_${V}_aarch64.zip.sha256")
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Published sha256 is not 64 lowercase hex characters: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # If this step fails, the likely cause is an expired HOMEBREW_TAP_TOKEN
      # (fine-grained tokens have an expiry date).
      - name: Check out Homebrew tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: hhoangg/homebrew-monoptah
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask and push
        if: steps.gate.outputs.enabled == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#native-v}"
          bash scripts/update-homebrew-cask.sh homebrew-tap/Casks/monoptah-native.rb "$V" "$SHA"
          cd homebrew-tap
          if git diff --quiet; then
            echo "Cask already pins $V, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Casks/monoptah-native.rb
          git commit -m "Update Monoptah Native to $V"
          # Rebase onto the tap's main before pushing, and retry once when the
          # push is rejected because someone else pushed in between.
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying." >&2
          done
          echo "Could not push the cask update to the tap." >&2
          exit 1
