name: Feature request
description: Suggest an idea or improvement for Monoptah
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Monoptah. Search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Monoptah do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done?
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
