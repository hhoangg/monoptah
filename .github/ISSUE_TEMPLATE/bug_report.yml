name: Bug report
description: Report a problem in Monoptah
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Monoptah supports macOS, Linux, and Windows. Search existing issues first.

  - type: input
    id: version
    attributes:
      label: Monoptah version
      description: Shown in the About dialog or the release you installed.
      placeholder: "Monoptah Native 0.53.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.5, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider CLI and version
      description: The CLI the session used and its version, or "Not provider-related".
      placeholder: "Claude Code 2.1.0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove tokens, API keys and other secrets before pasting.
      render: text
